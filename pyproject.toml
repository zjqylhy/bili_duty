[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biliduty"
version = "1.0.0"
description = "刷B站 · 不依赖 DeepSeek Harness 的独立常驻服务"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "bilibili-api-python>=17.3.0",
  "httpx>=0.27",
  "aiohttp>=3.9",
]

[project.optional-dependencies]
# 扫码登录要画二维码；只需要登录一次，装不装都行（终端里也能出文本码）
login = ["qrcode>=7.4"]
dev = ["pytest>=8"]

[project.scripts]
biliduty = "biliduty.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
biliduty = ["data/*.py", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
